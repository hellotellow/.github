name: Dependabot Pull Request Approve and Merge

on:
  workflow_call:
    inputs:
      pr-url:
        description: 'Deprecated and ignored. The pull request of the triggering event is always used.'
        required: false
        type: string
    secrets:
      repo-token:
        description: 'Token for checkout and push'
        required: true

jobs:
  dependabot:
    runs-on: ubuntu-latest
    # Checking the actor will prevent your Action run failing on non-Dependabot
    # PRs but also ensures that it only does work for Dependabot PRs.
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      # This first step will fail if there's no metadata and so the approval
      # will not occur.
      - name: Dependabot metadata
        id: dependabot-metadata
        uses: dependabot/fetch-metadata@v2.2.0
        with:
          github-token: ${{ secrets.repo-token }}

      # fetch-metadata inspects github.event.pull_request, so approve and merge
      # must target that same pull request. It can also leave update-type empty
      # for updates it cannot classify, so only an explicit patch is accepted.
      - name: Approve a PR
        if: ${{ steps.dependabot-metadata.outputs.update-type == 'version-update:semver-patch' }}
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.repo-token }}

      # --match-head-commit makes GitHub refuse the merge if the pull request
      # head is no longer the commit this run was triggered for.
      - name: Enable auto-merge for Dependabot PRs
        if: ${{ steps.dependabot-metadata.outputs.update-type == 'version-update:semver-patch' }}
        run: gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ secrets.repo-token }}
